[project]
name = "adnova-player"
version = "1.6.0"
description = "AdNova Player — plays the schedule on a Raspberry Pi at a stand"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # The local kiosk server. Uvicorn's standard extra pulls uvloop and
    # httptools, which the Pi handles fine and which keep the loop light.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # Device health: temperature, CPU, memory, disk for the heartbeat.
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Security() in a parameter default is the
# framework's documented idiom, not the bug the rule is about.
ignore = ["E501", "B008"]
